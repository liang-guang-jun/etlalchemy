[project]
name = "etlalchemy"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "GUANGJUN LIANG", email = "guangjun_l@icloud.com" }
]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "jinja2>=3.1.4",
    "lark>=1.1",
    "sqlalchemy>=2.0",
    "sqlglot>=30.26.0",
]

[project.optional-dependencies]
databricks = [
    "databricks-sdk>=0.18",
    "databricks-sql-connector>=4.0.1",
    "databricks-sqlalchemy>=2.0.10",
]
yaml = [
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipython>=8.0",
    "jupyter>=1.1.1",
    "mypy>=2.4.0",
    "pyperclip>=1.11.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "types-pyyaml>=6.0.12.20261030",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["etlalchemy"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
src = ["etlalchemy", "tests"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "UP", "D"]
# Mutually exclusive with D211/D212; ignore them when using google convention.
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Ignore pydocstyle (D) rules inside the test suite.
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
# The test tree is not a package, so every conftest.py maps to the same module
# name. Keep all of them out of the build so mypy does not report duplicate
# modules; pytest still loads them, and they hold only fixtures.
exclude = ["conftest\\.py$"]

[[tool.mypy.overrides]]
module = "tests.*"
# Allow untyped defs/calls in tests.
disallow_untyped_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["IPython.*"]
# IPython is an optional dependency: the diagram renders as plain HTML without
# it, so an environment that does not need notebooks must still type-check.
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = [".", "tests"]
addopts = "-ra -q"
