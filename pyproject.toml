[project]
name = "etlalchemy"
version = "0.0.1"
authors = [
    { name = "GUANGJUN LIANG", email = "guangjun_l@icloud.com" }
]
# The service is AGPL-3.0-or-later: the SPDX expression is the single source of
# truth (PEP 639) and ``license-files`` ships the GNU text in the wheel metadata.
# Replace it with "AGPL-3.0-only" to drop the "or any later version" clause.
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # The vendored asyncio infrastructure stores events through an async
    # SQLAlchemy engine, so SQLite needs the aiosqlite driver.
    "aiosqlite>=0.21",
    # Policy evaluation of the IAM context (model g/g2/keyMatch2).
    "casbin>=1.36",
    "dependency-injector>=4.49.1",
    # The official distribution provides the aggregates, events and persistence
    # interfaces; its asynchronous infrastructure is vendored in
    # ``etlalchemy/_vendor/eventsourcing/asyncio`` and leans on a few internal
    # helpers, so a minor upgrade must be validated against that copy. The
    # ``crypto`` extra provides pycryptodome, the backend of
    # ``eventsourcing.cipher:AESCipher`` used to encrypt event state at rest.
    "eventsourcing[crypto,postgres]>=9.5.6,<9.6",
    "fastapi>=0.162.2",
    "fastmcp>=2.12",
    "langchain-core>=0.3",
    "mcp>=2.3",
    "psycopg[binary]>=3.3.8",
    # Argon2id password hashing of the IAM context (library-recommended defaults).
    "pwdlib[argon2]>=0.2",
    "pydantic-settings>=2.16.2",
    # ``.env`` is exported by the configuration loader so ``env:`` secret
    # references and ``${VAR}`` placeholders see the local values.
    "python-dotenv>=1.0",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.3",
    # The asyncio extra provides greenlet, required by SQLAlchemy's async engine.
    "sqlalchemy[asyncio]>=2.0",
    # Every outbound client is httpx (the OpenAI SDK, the Databricks gateway and
    # the MCP client) and httpx refuses a SOCKS proxy without this shim: an
    # ``ALL_PROXY=socks5://…`` exported by the shell or the container would
    # otherwise fail each agent run with "install httpx[socks]".
    "socksio>=1.0",
    "structlog>=26.1.0",
    "tiktoken>=0.7",
    "typer>=0.28.0",
    # Imported directly by the vendored asyncio infrastructure
    # (``TypeVar`` with a default); eventsourcing pulls it in transitively.
    "typing-extensions>=4.12",
    "uvicorn[standard]>=0.54.0",
]

[project.urls]
Repository = "https://github.com/liang-guang-jun/etlalchemy"
Issues = "https://github.com/liang-guang-jun/etlalchemy/issues"

[project.scripts]
etla = "etlalchemy.app.cli.main:main"
etlalchemy = "etlalchemy.app.cli.main:main"

[project.optional-dependencies]
# LangGraph orchestration plus the durable checkpointers. One saver is picked at
# runtime from ``database.backend``, so both are declared here.
agent-graph = [
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=3.0",
    "langgraph-checkpoint-sqlite>=3.0",
]
# Chat model of the ``openai`` LLM provider kind.
agent-openai = [
    "langchain-openai>=0.3",
]
# Chat model of the ``databricks_ai_gateway`` LLM provider kind; the factory
# falls back to the OpenAI-compatible client when this is absent. ``workspace_client``
# support (used by a local Databricks CLI profile) landed in 0.22. A profile
# provider also works without this extra: ``databricks-sdk`` resolves the CLI
# credentials and ``langchain-openai`` calls the serving endpoints.
agent-databricks = [
    "databricks-langchain>=0.22",
]
# Read-only Databricks data source of the ingestion context and the credential
# resolver of a ``profile:`` LLM provider. The SDK is also pulled in by
# ``databricks-langchain``; this extra is for installs that do not need it.
databricks = [
    "databricks-sdk>=0.30",
]
# Optional MLflow tracing; disabled by default and imported lazily.
agent-obs = [
    "mlflow>=2.16",
]

[build-system]
# PEP 639 (``license`` as an SPDX expression plus top-level ``license-files``)
# needs hatchling 1.27 or newer.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pyperclip>=1.11.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261103",
    # The agent extras the test suite drives: LangGraph plus the SQLite
    # checkpointer and the OpenAI chat model adapter. Keeping them here means
    # ``uv sync`` in a fresh clone is enough to run the whole gate.
    "langchain-openai>=0.3",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=3.0",
    "langgraph-checkpoint-sqlite>=3.0",
]
# The documentation site: MkDocs with the Material theme, which also renders
# the Mermaid diagrams through ``pymdownx.superfences``. Kept in its own group
# so ``uv sync`` for the service does not download the docs toolchain.
docs = [
    "mkdocs-material>=9.7",
]

# ---------------------------------------------------------------------------
# Ruff: linter + formatter
# ---------------------------------------------------------------------------
[tool.ruff]
# Keep formatter and linter output stable on Python 3.13.
target-version = "py313"
line-length = 100
src = ["etlalchemy"]
# Never lint virtual environments, caches, build output or the test suite.
# ``etlalchemy/_vendor`` holds verbatim upstream code (see its README): it is
# neither documented to house style nor reformatted, so a later upstream commit
# can be diffed against it.
extend-exclude = [".venv", "tests", ".cache", "build", "dist", "etlalchemy/_vendor"]
# Keep all tool caches under a single, git-ignored ".cache" directory.
cache-dir = ".cache/ruff"

[tool.ruff.lint]
# Start from the broad default set plus the plugins listed below.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "N",   # pep8-naming
    "D",   # pydocstyle (docstrings)
    "UP",  # pyupgrade (modern Python 3.13 syntax)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PT",  # flake8-pytest-style
    "RUF", # Ruff-specific rules
]

# Keep the docs rules that matter in this project explicit so it is obvious
# that every module, class and function must be documented:
#   D100 - missing docstring in public module
#   D101 - missing docstring in public class
#   D102 - missing docstring in public method
#   D103 - missing docstring in public function
#   D104 - missing docstring in public package
#   D105 - missing docstring in magic method
# Those codes are part of "D"; pydocstyle rules that conflict with the
# Google style are ignored here instead of by convention only.
ignore = [
    "D203", # 1 blank line required before class docstring (conflicts with D211)
    "D213", # multi-line summary should start on the second line (conflicts with D212)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# mypy: static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
# Type-check the package only; tests and the virtualenv are out of scope.
files = ["etlalchemy"]
# Keep the incremental cache next to the other tools' caches.
cache_dir = ".cache/mypy"
strict = true
pretty = true
show_error_codes = true
show_column_numbers = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true
exclude = ["(^|/)\\.venv/", "(^|/)tests/", "^build/", "^dist/"]

# Third-party libraries without a py.typed marker.
[[tool.mypy.overrides]]
module = ["casbin"]
ignore_missing_imports = true

# The vendored asyncio infrastructure is upstream code kept verbatim, so its
# diagnostics are suppressed while our subclasses still resolve their members.
[[tool.mypy.overrides]]
module = ["etlalchemy._vendor.*"]
ignore_errors = true

# Optional provider packages: only the extras install them, and the code imports
# them lazily, so type checkers must not require them.
[[tool.mypy.overrides]]
module = ["databricks_langchain.*", "mlflow.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Keep "lastfailed" and other pytest state out of the project root.
cache_dir = ".cache/pytest"
addopts = "-ra --strict-markers --strict-config"
pythonpath = ["."]
filterwarnings = ["error"]
# The whole code base is asynchronous: plain ``async def`` test functions and
# async fixtures are collected without an explicit marker.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs a running PostgreSQL database (TEST_DATABASE_URL)",
]
